# EXAMPLE — copy to the project vault and fill with real values:
#   ~/.local/share/agent-projects/applyforge/data/candidate.yaml
# Rule 035: the REAL file lives in the vault, NEVER in this repo.
# Read at runtime by the eligibility screening (data-driven — no hardcoding).
candidate:
  nationality: french           # a value that is NOT "french" enables the nationality blocker
  eu_citizen: true
  driving_licence_b: true       # false -> offers requiring "permis B" are blocked
  civil_servant: false          # false -> offers reserved to civil servants are blocked
  experience_years: 0           # years of professional experience
  residence_permit:
    type: none                  # e.g. RECE, salarie, talent, none
    valid_until: "YYYY-MM-DD"

  cv_location:
    city: "City Name"           # The city to display on the CV (empty = derive from job posting)
    always_use: false           # If true, always use this city regardless of the job's location
    mobility_fr: "mobile en France"
    country: "France"

  positioning:
    max_experience_entries: 0   # 0 means "no rule" (include relevant positions). >0 limits history
    avoid_titles: []            # e.g. ["Technicien"] - never use these as the CV tagline
    avoid_labels: []            # e.g. ["jeune diplômé", "junior", "débutant"]
    framing: ""                 # e.g. "profil expérimenté en transition"
    allow_stating_years: false  # If true, allows the LLM to state exact years of experience from the profile

  # Replaces the year count as the way seniority is expressed.
  # Default behaviour with an empty block: no duration is ever written, anywhere.
  cv_evidence:
    # Quantified scale facts the LLM may reuse INSTEAD of "N years of experience".
    # Flat list, or a per-language mapping ({fr: [...], en: [...]}).
    scale: []                   # e.g. ["supervision de 40+ sites", "astreinte 24/7"]

    # The ONLY figure that may ever be written, and only when the posting itself
    # demands N years. It is capped at `years`, so the answer matches the ask
    # without ever inflating the real record. years: 0 disables the exception.
    countable_window:
      years: 0                  # continuous, defensible years in the target domain
      from_year: null           # e.g. 2021 — quoted alongside the figure as proof
      to_year: null             # e.g. 2024
